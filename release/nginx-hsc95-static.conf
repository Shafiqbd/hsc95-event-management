# Nginx site for HSC 95 with the STATIC frontend build (frontend `npm run build:prod` → out/).
# Nginx serves the HTML/JS/CSS files itself and forwards /api to the NestJS backend.
#
#   1. Copy frontend/out/ to /var/www/hsc95/frontend   (index.html must be directly inside)
#   2. Copy this file to /etc/nginx/sites-available/hsc95 and enable it
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d hsc95society.com -d www.hsc95society.com   (HTTPS is required for login)

server {
    listen 80;
    server_name hsc95society.com www.hsc95society.com;

    root /var/www/hsc95/frontend;
    index index.html;

    # Member photos are uploaded through /api (2 MB limit).
    client_max_body_size 3m;

    # Same security headers the Next.js dev server sends.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → NestJS backend (never expose port 4000 itself).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sending SMS in batches can take a little while.
        proxy_read_timeout 60s;
    }

    # Redirects the Next.js server used to do.
    location = /backend  { return 302 /backend/dashboard/; }
    location = /backend/ { return 302 /backend/dashboard/; }
    location ^~ /user    { return 302 /backend/login/; }

    # Build assets have content hashes in their names: cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: /backend/login and /backend/login/ both serve backend/login/index.html.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
